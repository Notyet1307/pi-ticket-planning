name: Disposable live integration

on:
  workflow_dispatch:
    inputs:
      repo:
        description: Exact allowlisted disposable owner/repo
        required: true
      run_id:
        description: Unique run identity
        required: true
      confirmation:
        description: One-time confirmation from expectedConfirmation(repo, run_id)
        required: true

permissions:
  contents: read
  issues: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  integration:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 120
    environment: ptp-disposable-e2e
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Active Capability receipt
        run: |
          mkdir -p '${{ runner.temp }}/ptp-evidence'
          set +e
          node scripts/planctl.mjs doctor --capabilities --active-probe --json > '${{ runner.temp }}/ptp-evidence/capability-envelope.json'
          status=$?
          set -e
          test "$status" -eq 0 -o "$status" -eq 1
          jq -e '.data.receipt.schema == "pi-ticket-planning:capability-receipt:v1"' '${{ runner.temp }}/ptp-evidence/capability-envelope.json'
          jq '.data.receipt' '${{ runner.temp }}/ptp-evidence/capability-envelope.json' > '${{ runner.temp }}/ptp-evidence/capability-receipt.json'
        env:
          PI_TICKET_PLAN_TARGET: github:${{ inputs.repo }}
          PI_TICKET_PLAN_PROVIDER: ${{ vars.PTP_PROVIDER }}
          PI_TICKET_PLAN_MODEL: ${{ vars.PTP_MODEL }}
          PI_TICKET_PLAN_THINKING: ${{ vars.PTP_THINKING }}
          PI_TICKET_PLAN_HARNESS_CLI: ${{ vars.PTP_HARNESS_CLI }}
          PI_TICKET_PLAN_HARNESS_CONFIG: ${{ secrets.PTP_HARNESS_CONFIG }}
      - id: live
        continue-on-error: true
        run: npm run test:integration:live
        env:
          PI_TICKET_PLAN_E2E: "1"
          E2E_REPO: ${{ inputs.repo }}
          E2E_ALLOWLIST: ${{ vars.PTP_E2E_ALLOWLIST }}
          E2E_CONFIRM_WRITE: ${{ inputs.confirmation }}
          E2E_RUN_ID: ${{ inputs.run_id }}
          E2E_ACTOR_ALLOWLIST: ${{ vars.PTP_E2E_ACTOR_ALLOWLIST }}
          E2E_REPO_TOPIC: ${{ vars.PTP_E2E_REPO_TOPIC }}
          E2E_DEFAULT_BRANCH: ${{ vars.PTP_E2E_DEFAULT_BRANCH }}
          E2E_NO_PRODUCTION_REMOTE: "1"
          PTP_CAPABILITY_RECEIPT: ${{ runner.temp }}/ptp-evidence/capability-receipt.json
          PTP_E2E_REPORT: ${{ runner.temp }}/ptp-evidence/e2e-report.json
          PTP_E2E_STATE: ${{ runner.temp }}/ptp-evidence/e2e-state.json
          GH_TOKEN: ${{ github.token }}
          PI_TICKET_PLAN_TARGET: github:${{ inputs.repo }}
          PI_TICKET_PLAN_PROVIDER: ${{ vars.PTP_PROVIDER }}
          PI_TICKET_PLAN_MODEL: ${{ vars.PTP_MODEL }}
          PI_TICKET_PLAN_THINKING: ${{ vars.PTP_THINKING }}
          PI_TICKET_PLAN_HARNESS_CLI: ${{ vars.PTP_HARNESS_CLI }}
          PI_TICKET_PLAN_HARNESS_CONFIG: ${{ secrets.PTP_HARNESS_CONFIG }}
      - name: Recover or verify disposable cleanup
        id: cleanup
        if: always()
        run: npm run e2e:cleanup -- --state "$PTP_E2E_STATE" --repo '${{ inputs.repo }}' --run-id '${{ inputs.run_id }}'
        env:
          PTP_E2E_STATE: ${{ runner.temp }}/ptp-evidence/e2e-state.json
          E2E_ALLOWLIST: ${{ vars.PTP_E2E_ALLOWLIST }}
          GH_TOKEN: ${{ github.token }}
      - uses: actions/attest@v4
        if: always()
        with:
          subject-path: |
            ${{ runner.temp }}/ptp-evidence/capability-receipt.json
            ${{ runner.temp }}/ptp-evidence/e2e-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ptp-evidence/capability-envelope.json
            ${{ runner.temp }}/ptp-evidence/capability-receipt.json
            ${{ runner.temp }}/ptp-evidence/e2e-report.json
      - name: Enforce complete evidence run
        if: always()
        run: test '${{ steps.live.outcome }}' = success && test '${{ steps.cleanup.outcome }}' = success
