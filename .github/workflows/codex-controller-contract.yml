name: Codex Controller Contract

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: lock
        run: node -e 'const fs=require("node:fs");const c=require("./compatibility/codex-controller-contract.json").commit;if(!/^[a-f0-9]{40}$/.test(c))process.exit(1);fs.appendFileSync(process.env.GITHUB_OUTPUT,`commit=${c}\n`)'
      - uses: actions/checkout@v7
        with:
          repository: Notyet1307/herdr-codex-controller
          ref: ${{ steps.lock.outputs.commit }}
          path: herdr-codex-controller
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 26.x
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: herdr-codex-controller
      - run: npm run verify
        working-directory: herdr-codex-controller
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check:codex-controller-contract
      - run: npm run canary:codex-controller-contract -- --controller-root "${{ github.workspace }}/herdr-codex-controller"
