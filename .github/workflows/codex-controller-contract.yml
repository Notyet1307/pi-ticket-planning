name: Codex Controller Contract

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: lock
        run: node -e 'const fs=require("node:fs");const c=require("./compatibility/codex-controller-contract.json");if(!/^[a-f0-9]{40}$/.test(c.commit)||c.integrationMode!=="release-plan-v2-direct"||c.dispatcherQualified!==false||c.operatorStartRequired!==true)process.exit(1);fs.appendFileSync(process.env.GITHUB_OUTPUT,`commit=${c.commit}\n`)'
      - uses: actions/checkout@v7
        with:
          repository: Notyet1307/herdr-codex-controller
          ref: ${{ steps.lock.outputs.commit }}
          path: herdr-codex-controller
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 26.x
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: herdr-codex-controller
      - name: Prepare sandbox-visible Node runtime
        run: |
          NODE_ROOT="$(dirname "$(dirname "$(command -v node)")")"
          sudo mkdir -p /usr/local/lib/herdr-node
          sudo cp -R "$NODE_ROOT/." /usr/local/lib/herdr-node/
      - run: |
          export PATH="/usr/local/lib/herdr-node/bin:/usr/bin:/bin"
          npm run verify
        working-directory: herdr-codex-controller
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run generate:codex-controller-contract -- --controller-root "${{ github.workspace }}/herdr-codex-controller"
      - run: npm run check:codex-controller-contract
      - run: npm run canary:codex-controller-contract -- --controller-root "${{ github.workspace }}/herdr-codex-controller"
