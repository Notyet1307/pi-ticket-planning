name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22.16.0, 26.x]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run verify:ci
  whole-repository-coverage:
    name: observed whole-repository coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:coverage:all
  verify:
    if: always()
    needs: [test, whole-repository-coverage]
    runs-on: ubuntu-latest
    steps:
      - run: test '${{ needs.test.result }}' = success && test "${{ needs['whole-repository-coverage'].result }}" = success
