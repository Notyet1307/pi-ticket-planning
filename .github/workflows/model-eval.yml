name: Model behavioral evaluation

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 2"

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  model-eval:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 120
    environment: ptp-model-eval
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Active Capability receipt
        run: |
          mkdir -p '${{ runner.temp }}/ptp-evidence'
          set +e
          node scripts/planctl.mjs doctor --capabilities --active-probe --json > '${{ runner.temp }}/ptp-evidence/capability-envelope.json'
          status=$?
          set -e
          test "$status" -eq 0 -o "$status" -eq 1
          jq -e '.data.receipt.schema == "pi-ticket-planning:capability-receipt:v1"' '${{ runner.temp }}/ptp-evidence/capability-envelope.json'
          jq '.data.receipt' '${{ runner.temp }}/ptp-evidence/capability-envelope.json' > '${{ runner.temp }}/ptp-evidence/capability-receipt.json'
        env:
          PI_TICKET_PLAN_TARGET: github:${{ vars.PTP_TARGET_REPO }}
          PI_TICKET_PLAN_PROVIDER: ${{ vars.PTP_PROVIDER }}
          PI_TICKET_PLAN_MODEL: ${{ vars.PTP_MODEL }}
          PI_TICKET_PLAN_THINKING: ${{ vars.PTP_THINKING }}
          PI_TICKET_PLAN_HARNESS_CLI: ${{ vars.PTP_HARNESS_CLI }}
          PI_TICKET_PLAN_HARNESS_CONFIG: ${{ secrets.PTP_HARNESS_CONFIG }}
      - id: model
        continue-on-error: true
        run: npm run eval:pi -- --suite release --repeat 3 --retry-failures 1 --require-clean --report '${{ runner.temp }}/ptp-evidence/model-eval.json'
        env:
          PI_EVAL_MODEL: ${{ vars.PTP_PROVIDER }}/${{ vars.PTP_MODEL }}
          PI_EVAL_THINKING: ${{ vars.PTP_THINKING }}
          PTP_CAPABILITY_RECEIPT: ${{ runner.temp }}/ptp-evidence/capability-receipt.json
      - uses: actions/attest@v4
        if: always()
        with:
          subject-path: |
            ${{ runner.temp }}/ptp-evidence/capability-receipt.json
            ${{ runner.temp }}/ptp-evidence/model-eval.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ptp-evidence/*.json
      - name: Enforce complete evidence run
        if: always()
        run: test '${{ steps.model.outcome }}' = success
