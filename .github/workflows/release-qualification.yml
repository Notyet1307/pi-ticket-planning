name: Release qualification

on:
  workflow_dispatch:
    inputs:
      e2e_run_id:
        description: Exact successful Disposable E2E workflow run ID
        required: true
      model_run_id:
        description: Exact successful Model evaluation workflow run ID
        required: true

permissions:
  actions: read
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  qualify:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30
    environment: ptp-release-qualification
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Download exact evidence runs
        run: |
          mkdir -p '${{ runner.temp }}/ptp-qualification/e2e' '${{ runner.temp }}/ptp-qualification/model' '${{ runner.temp }}/ptp-qualification/output'
          gh run download '${{ inputs.e2e_run_id }}' --repo '${{ github.repository }}' --dir '${{ runner.temp }}/ptp-qualification/e2e'
          gh run download '${{ inputs.model_run_id }}' --repo '${{ github.repository }}' --dir '${{ runner.temp }}/ptp-qualification/model'
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Qualify current commit
        id: qualify
        continue-on-error: true
        run: |
          export PTP_E2E_REPORTS="$(find '${{ runner.temp }}/ptp-qualification/e2e' -name e2e-report.json -type f | paste -sd, -)"
          export PTP_MODEL_REPORTS="$(find '${{ runner.temp }}/ptp-qualification/model' -name model-eval.json -type f | paste -sd, -)"
          export PTP_CAPABILITY_RECEIPTS="$(find '${{ runner.temp }}/ptp-qualification/e2e' '${{ runner.temp }}/ptp-qualification/model' -name capability-receipt.json -type f | paste -sd, -)"
          export PTP_QUALIFICATION_REPORT='${{ runner.temp }}/ptp-qualification/output/release-qualification.json'
          test -n "$PTP_E2E_REPORTS" && test -n "$PTP_MODEL_REPORTS" && test -n "$PTP_CAPABILITY_RECEIPTS"
          npm run release:qualify
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/attest@v4
        if: always()
        with:
          subject-path: ${{ runner.temp }}/ptp-qualification/output/release-qualification.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ptp-qualification/output/*.json
      - name: Enforce complete qualification
        if: always()
        run: test '${{ steps.qualify.outcome }}' = success
