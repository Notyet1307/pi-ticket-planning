name: Release qualification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30
    environment: ptp-release-qualification
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run release:qualify
        env:
          PTP_E2E_REPORTS: ${{ vars.PTP_E2E_REPORTS }}
          PTP_MODEL_REPORTS: ${{ vars.PTP_MODEL_REPORTS }}
